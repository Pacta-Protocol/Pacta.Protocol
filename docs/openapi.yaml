openapi: 3.1.0
info:
  title: Pacta Protocol REST API
  version: 0.1.0
  summary: The trust layer of agentic commerce - REST surface of the Pacta reference implementation.
  description: |
    The full lifecycle an AI agent (or any client) uses to discover, contract,
    escrow, verify and pay real-world SMB services on a Pacta marketplace.

    All amounts are **integer cents** of simulated USD. Errors are
    `{"error": "message"}` with `400` (validation), `404` (not found) or `409`
    (conflict with protocol rules). The normative protocol rules - state machine,
    ledger invariant, staking, slashing, registry verification - live in
    [SPEC.md](./SPEC.md); this document is the exact HTTP shape of the reference
    implementation.

    Endpoints marked **[Pacta]** exist or change behavior only when the server
    runs the Pacta profile (`npm run start:pacta`, default port 3220).

    **Hardening (all opt-in by configuration).** With `REQUIRE_API_KEYS=1` every
    mutation must carry `Authorization: Bearer pk_...` for the acting party
    (`401`/`403` otherwise) and dispute resolution requires the configured
    arbiter key; reads always stay open. Requests beyond `RATE_LIMIT_PER_MIN`
    (default 600 per client per minute, `0` disables) get `429` with a
    `Retry-After` header. Money-moving POSTs honor an `Idempotency-Key` header:
    the first 2xx response is stored and replayed verbatim on retries. Proof
    verification runs against a pluggable registry adapter (`REGISTRY_ADAPTER`:
    `local`, `http` or `hacienda-cr`); when the configured registry cannot
    answer, affected endpoints return `502` rather than guessing.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Pacta Protocol
    url: https://pactaprotocol.org
externalDocs:
  description: Protocol specification (SPEC.md)
  url: https://github.com/Pacta-Protocol/Pacta.Protocol/blob/main/docs/SPEC.md
# Open by default (clients declare who they act for; SPEC.md Appendix B). When
# the deployment sets REQUIRE_API_KEYS=1, mutations require the bearer key below.
security: []
servers:
  - url: http://localhost:3220/api
    description: Local Pacta-profile server (staking, registry verification)
  - url: http://localhost:3210/api
    description: Local Base-profile server (contrast baseline)
tags:
  - name: meta
    description: Server profile and machine-readable agent manifest.
  - name: parties
    description: Agents, SMBs and arbiters.
  - name: offers
    description: Publishing and discovering service offers.
  - name: engagements
    description: The contract lifecycle - draft, agree, fund, deliver, verify, settle.
  - name: registry
    description: Public-registry lookups used to verify proofs. [Pacta]
  - name: ledger
    description: Accounts, transaction journal and the ledger invariant.
  - name: integrity
    description: >-
      Phase 0 (ADR-001) - cryptographic agreement immutability: signing keys,
      receipts with Merkle proofs to publicly anchored roots, and independent
      verification.

paths:
  /config:
    get:
      operationId: getConfig
      tags: [meta]
      summary: Server profile and feature flags
      responses:
        '200':
          description: Which profile this server runs.
          content:
            application/json:
              schema:
                type: object
                required: [plan, registry_adapter, features, hardening]
                properties:
                  plan:
                    type: string
                    enum: [base, pacta]
                  registry_adapter:
                    type: string
                    enum: [local, http, hacienda-cr]
                    description: Which registry adapter verifies proof references.
                  features:
                    type: object
                    required: [staking, registry_verification, agent_manifest]
                    properties:
                      staking: { type: boolean }
                      registry_verification: { type: boolean }
                      agent_manifest: { type: boolean }
                  hardening:
                    type: object
                    required: [api_keys_enforced, rate_limit_per_min, idempotency_keys, provider_webhooks]
                    properties:
                      api_keys_enforced: { type: boolean }
                      rate_limit_per_min:
                        type: integer
                        description: Requests per client per minute; 0 means disabled.
                      idempotency_keys: { type: boolean }
                      provider_webhooks: { type: boolean }

  /health:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Liveness check for deployment and monitoring
      description: >-
        Cheap, unauthenticated, never mutates anything. Suitable for systemd,
        Caddy, or uptime checks.
      responses:
        '200':
          description: The server and database are up.
          content:
            application/json:
              schema:
                type: object
                required: [status, plan, ledger_ok]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  plan:
                    type: string
                    enum: [base, pacta]
                  ledger_ok:
                    type: boolean
                    description: Result of the ledger double-entry conservation invariant.

  /agent/manifest:
    get:
      operationId: getAgentManifest
      tags: [meta]
      summary: Machine-readable description of the agent-side lifecycle
      description: |
        Designed to be wrapped 1:1 by an MCP server (the reference MCP server in
        `mcp/server.js` does exactly that) so any AI agent can consume the
        marketplace without a custom SDK.
      responses:
        '200':
          description: Tool list with methods, paths and parameter hints.
          content:
            application/json:
              schema:
                type: object
                required: [name, plan, description, tools]
                properties:
                  name: { type: string }
                  plan: { type: string, enum: [base, pacta] }
                  description: { type: string }
                  tools:
                    type: array
                    items:
                      type: object
                      required: [name, method, path, description]
                      properties:
                        name: { type: string }
                        method: { type: string }
                        path: { type: string }
                        description: { type: string }
                        params:
                          type: object
                          additionalProperties: { type: string }

  /users:
    get:
      operationId: listUsers
      tags: [parties]
      summary: All parties (agents, SMBs, arbiters)
      responses:
        '200':
          description: Every party on the marketplace, with balances and profiles.
          content:
            application/json:
              schema:
                type: object
                required: [agents, smbs, arbiters]
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/AgentBalance' }
                  smbs:
                    type: array
                    items: { $ref: '#/components/schemas/SmbPublic' }
                  arbiters:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: integer }
                        name: { type: string }

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [parties]
      summary: One agent with its current balance
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentBalance' }
        '404': { $ref: '#/components/responses/NotFound' }

  /smbs:
    get:
      operationId: listSmbs
      tags: [parties]
      summary: All SMBs (public profiles)
      responses:
        '200':
          description: Public profile of every SMB.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SmbPublic' }
    post:
      operationId: registerSmb
      tags: [parties]
      summary: Register an SMB
      description: |
        Base profile: the vetted badge is auto-granted at registration.
        **[Pacta]**: vetted only by posting collateral - pass `stake_cents > 0`
        here, or stake later via `POST /smbs/{id}/stake`; without a stake the SMB
        is registered but **not** vetted and cannot be hired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, location]
              properties:
                name: { type: string }
                category: { type: string, examples: [legal, tourism, real-estate, accounting] }
                location: { type: string }
                description: { type: string }
                capabilities:
                  type: string
                  description: Comma-separated keywords matched by search.
                stake_cents:
                  type: integer
                  minimum: 0
                  description: "[Pacta] Optional initial collateral, integer cents."
      responses:
        '201':
          description: The registered SMB, including its API key (shown only here).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SmbPublic'
                  - type: object
                    required: [api_key]
                    properties:
                      api_key:
                        type: string
                        description: >-
                          Shown once at registration; only its hash is stored.
                          Used as `Authorization: Bearer pk_smb_...` when the
                          deployment enforces API keys.
        '400': { $ref: '#/components/responses/Validation' }
        '409': { $ref: '#/components/responses/Conflict' }

  /smbs/{id}:
    get:
      operationId: getSmb
      tags: [parties]
      summary: One SMB with balance and offers
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Public profile plus money balance and published offers.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SmbPublic'
                  - type: object
                    required: [balance_cents, offers]
                    properties:
                      balance_cents: { type: integer }
                      offers:
                        type: array
                        items: { $ref: '#/components/schemas/Offer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /smbs/{id}/stake:
    post:
      operationId: depositStake
      tags: [parties]
      summary: Post (more) stake [Pacta]
      description: |
        A simulated external deposit into the SMB's collateral account. Grants or
        restores the vetted badge and raises the exposure cap. Returns `404` on a
        Base-profile server.
      parameters:
        - $ref: '#/components/parameters/idParam'
        - $ref: '#/components/parameters/idempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents:
                  type: integer
                  minimum: 1
                  description: Positive integer cents.
      responses:
        '201':
          description: The SMB with its updated stake, cap and badge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmbPublic' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{id}/api-key:
    post:
      operationId: claimAgentApiKey
      tags: [parties]
      summary: Claim or rotate an agent's API key
      description: |
        The first claim on a keyless identity (seeded demo data) is open, as a
        bootstrap. Once a key exists, rotation requires presenting the current
        key in the `Authorization` header. The key is returned once; only its
        SHA-256 hash is stored.
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '201':
          description: The new key.
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, api_key]
                properties:
                  agent_id: { type: integer }
                  api_key: { type: string }
        '403':
          description: A key already exists and the current key was not presented.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /smbs/{id}/api-key:
    post:
      operationId: claimSmbApiKey
      tags: [parties]
      summary: Claim or rotate an SMB's API key
      description: |
        Same contract as `POST /agents/{id}/api-key`: first claim open on a
        keyless identity, rotation requires the current key.
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '201':
          description: The new key.
          content:
            application/json:
              schema:
                type: object
                required: [smb_id, api_key]
                properties:
                  smb_id: { type: integer }
                  api_key: { type: string }
        '403':
          description: A key already exists and the current key was not presented.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /smbs/{id}/webhook:
    post:
      operationId: setSmbWebhook
      tags: [parties]
      summary: Register a provider webhook (push instead of poll)
      description: |
        Engagement state changes the SMB is party to (`engagement.agreed`,
        `.funded`, `.completed`, `.disputed`, `.resolved`) are POSTed to this URL
        as JSON, signed with `X-Pacta-Signature: sha256=<HMAC-SHA256(body)>`
        using the returned secret. Delivery is best-effort with one attempt and
        a short timeout; the engagement state remains the source of truth.
        Pass `url: null` to remove the webhook.
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: [string, 'null']
                  description: http(s) URL to deliver events to, or null to clear.
      responses:
        '201':
          description: The webhook registration; the signing secret is shown only here.
          content:
            application/json:
              schema:
                type: object
                required: [smb_id, webhook_url]
                properties:
                  smb_id: { type: integer }
                  webhook_url: { type: [string, 'null'] }
                  webhook_secret: { type: string }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /offers:
    get:
      operationId: searchOffers
      tags: [offers]
      summary: Search offers
      description: |
        `q` keywords are AND-matched (case- and accent-insensitive substring) across the offer
        title/description/steps and the SMB name/category/location/capabilities.
        Ranked by SMB rating score (good - bad) descending, then price ascending,
        then id.
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Space-separated keywords, all must match.
          example: lawyer costa rica hotel
        - name: category
          in: query
          schema: { type: string }
          description: Exact category filter (case- and accent-insensitive).
        - name: location
          in: query
          schema: { type: string }
          description: Location substring filter (case- and accent-insensitive).
        - name: vetted
          in: query
          schema: { type: string, enum: ['1', 'true', 'yes', 'on'] }
          description: Any truthy value keeps only vetted SMBs.
      responses:
        '200':
          description: Matching active offers, ranked.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Offer' }
    post:
      operationId: publishOffer
      tags: [offers]
      summary: Publish an offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [smb_id, title, price_cents, upfront_pct, steps]
              properties:
                smb_id: { type: integer }
                title: { type: string }
                description: { type: string }
                price_cents: { type: integer, minimum: 1 }
                upfront_pct:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Percentage of the price escrowed as downpayment.
                steps:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [title]
                    properties:
                      title: { type: string }
                      description: { type: string }
      responses:
        '201':
          description: The published offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /offers/{id}:
    get:
      operationId: getOffer
      tags: [offers]
      summary: One offer with steps, terms and SMB profile
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: The offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /engagements:
    get:
      operationId: listEngagements
      tags: [engagements]
      summary: List engagements (filterable)
      parameters:
        - name: agent_id
          in: query
          schema: { type: integer }
        - name: smb_id
          in: query
          schema: { type: integer }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/EngagementState' }
      responses:
        '200':
          description: Engagements, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Engagement' }
    post:
      operationId: createEngagement
      tags: [engagements]
      summary: Create a draft engagement from an offer
      description: |
        Snapshots the offer's steps and terms into a `draft` contract - nothing is
        binding or paid yet. Posting the same offer + agent again while a draft is
        open returns the existing draft (`200`) instead of a duplicate.
        **[Pacta]**: fails `409` if the SMB is not vetted (no stake posted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offer_id, agent_id]
              properties:
                offer_id: { type: integer }
                agent_id: { type: integer }
      responses:
        '201':
          description: The new draft engagement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '200':
          description: An existing open draft for the same offer + agent (dedupe).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /engagements/{id}:
    get:
      operationId: getEngagement
      tags: [engagements]
      summary: One engagement - state, steps, proofs, escrow balance
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: The engagement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '404': { $ref: '#/components/responses/NotFound' }

  /engagements/{id}/steps/{stepId}:
    patch:
      operationId: editStep
      tags: [engagements]
      summary: Edit a step (draft only)
      description: |
        Steps are editable only while the engagement is a `draft`. From `agreed`
        onward the contract is immutable and this returns `409`.
      parameters:
        - $ref: '#/components/parameters/idParam'
        - $ref: '#/components/parameters/stepIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '200':
          description: The engagement with the edited step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /engagements/{id}/agree:
    post:
      operationId: agreeEngagement
      tags: [engagements]
      summary: 'Lock the contract (draft -> agreed)'
      description: |
        Terms and steps become immutable. Locking now means **signing**
        (ADR-001): the terms are canonicalized (RFC 8785) and hashed
        (`agreement_hash`, the engagement's universal identity), and both
        parties sign the hash via EIP-712. Parties with custodial keys
        (disclosed launch default) are signed for server-side; self-custody
        parties must send `buyer_signature` / `provider_signature` (see
        `GET /engagements/{id}/agreement-preview`). Both signatures are
        verified, persisted, and recorded in the append-only event log; the
        response carries the `AgreementLocked` receipt.
        **[Pacta]**: fails `409` if the SMB's
        active exposure plus this price would exceed its exposure cap
        (5 x stake + 50% of completed GMV); the message includes the exact amounts.
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                buyer_signature:
                  type: string
                  description: EIP-712 signature (r||s||v hex) by the buyer's self-custody key.
                provider_signature:
                  type: string
                  description: EIP-712 signature (r||s||v hex) by the provider's self-custody key.
      responses:
        '200':
          description: The agreed engagement, with its `AgreementLocked` receipt.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Engagement'
                  - type: object
                    properties:
                      receipt: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /engagements/{id}/fund:
    post:
      operationId: fundEscrow
      tags: [engagements]
      summary: 'Fund escrow with the downpayment (agreed -> funded)'
      description: |
        Moves `round(price x upfront_pct / 100)` cents from the agent's account
        into the engagement's escrow account, atomically with the state change.
        Fails `409` (insufficient funds) leaving everything unchanged.
      parameters:
        - $ref: '#/components/parameters/idParam'
        - $ref: '#/components/parameters/idempotencyKeyParam'
      responses:
        '200':
          description: The funded engagement (see `escrow_balance_cents`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /engagements/{id}/steps/{stepId}/complete:
    post:
      operationId: completeStep
      tags: [engagements]
      summary: Provider marks a step done with proof
      description: |
        Allowed only while `funded` or `in_progress` (escrow first, work second);
        the first completion moves `funded -> in_progress`. **[Pacta]**: a step
        with a `verification_kind` additionally requires `registry_ref`, which
        must exist in the public registry **and** be of the step's kind - the
        proof is then stored as platform-verified.
      parameters:
        - $ref: '#/components/parameters/idParam'
        - $ref: '#/components/parameters/stepIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof_text]
              properties:
                proof_text: { type: string }
                proof_url: { type: string }
                registry_ref:
                  type: string
                  description: "[Pacta] Required for registry-anchored steps."
                  examples: [CR-RN-2026-104512]
      responses:
        '200':
          description: The engagement with the completed step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/RegistryUnavailable' }

  /engagements/{id}/submit:
    post:
      operationId: submitEngagement
      tags: [engagements]
      summary: 'Provider submits for verification (-> submitted)'
      description: Fails `409` unless every step is done with proof.
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: The submitted engagement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /engagements/{id}/approve:
    post:
      operationId: approveEngagement
      tags: [engagements]
      summary: 'Agent accepts the proofs - settlement (submitted -> completed)'
      description: |
        One atomic transaction draws the remaining balance from the agent,
        releases the full escrow to the SMB and flips the state - double release
        is structurally impossible. Irreversible: verify the proofs first.
      parameters:
        - $ref: '#/components/parameters/idParam'
        - $ref: '#/components/parameters/idempotencyKeyParam'
      responses:
        '200':
          description: The completed engagement (escrow zeroed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /engagements/{id}/reject:
    post:
      operationId: rejectEngagement
      tags: [engagements]
      summary: 'Agent rejects the proofs - dispute (submitted -> disputed)'
      description: Escrow stays held for the arbiter. The provider risks its stake.
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The disputed engagement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /engagements/{id}/resolve:
    post:
      operationId: resolveDispute
      tags: [engagements]
      summary: 'Arbiter rules on a dispute (disputed -> resolved)'
      description: |
        Disposes of the held escrow: `release` -> all to the SMB, `refund` -> all
        to the agent, `split` -> 50/50 (odd cent to the SMB). **[Pacta]**: an
        adverse ruling slashes the SMB's stake in the same transaction - 20% of
        the price on `refund`, 10% on `split`, bounded by the stake balance, paid
        to the agent; a stake drained to zero clears the vetted badge.
      parameters:
        - $ref: '#/components/parameters/idParam'
        - $ref: '#/components/parameters/idempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruling]
              properties:
                ruling:
                  type: string
                  enum: [release, refund, split]
      responses:
        '200':
          description: The resolved engagement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /engagements/{id}/rate:
    post:
      operationId: rateProvider
      tags: [engagements]
      summary: Agent rates the SMB after settlement
      description: |
        Only in state `completed` or `resolved`, once per engagement. Feeds the
        SMB's aggregate and re-ranks search results.
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  enum: [good, bad]
      responses:
        '201':
          description: The rated engagement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /registry/{ref}:
    get:
      operationId: lookupRegistryRecord
      tags: [registry]
      summary: Look up a public-registry record by reference
      description: |
        The independent-verification primitive: agents re-check every
        `proof_registry_ref` here before approving. Not-found means the proof
        does not verify.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
          example: CR-RN-2026-104512
      responses:
        '200':
          description: The official record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/RegistryUnavailable' }

  /disputes:
    get:
      operationId: listDisputes
      tags: [engagements]
      summary: Disputed and resolved engagements
      responses:
        '200':
          description: Engagements in state `disputed` or `resolved`, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Engagement' }

  /ledger:
    get:
      operationId: getLedger
      tags: [ledger]
      summary: Accounts, recent transactions and the invariant
      responses:
        '200':
          description: The ledger (transactions limited to the most recent 200).
          content:
            application/json:
              schema:
                type: object
                required: [accounts, transactions, invariant]
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  invariant: { $ref: '#/components/schemas/Invariant' }

  /ledger/invariant:
    get:
      operationId: checkInvariant
      tags: [ledger]
      summary: 'The ledger invariant: sum(balances) = sum(minted)'
      description: 'Must report `ok: true` at all times; auditors poll this.'
      responses:
        '200':
          description: The invariant check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invariant' }

  /engagements/{id}/agreement-preview:
    get:
      operationId: previewAgreement
      tags: [integrity]
      summary: What exactly would I be signing?
      description: |
        The canonical agreement (RFC 8785), its `agreement_hash`, and the
        EIP-712 signing digests for both roles. The self-custody flow: register
        a key (`POST /{kind}s/{id}/signing-key`), preview, sign the digest with
        your own key, send the signature to `/agree`. Drafts only; both parties
        must have registered keys (custodial-default parties can skip straight
        to `/agree`).
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Canonical agreement, hash and signing digests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  engagement_id: { type: integer }
                  agreement:
                    type: object
                    description: The canonical agreement object (schema pacta/agreement@1). No unhashed free text.
                  agreement_hash: { type: string }
                  eip712_domain: { $ref: '#/components/schemas/Eip712Domain' }
                  signing_digests:
                    type: object
                    properties:
                      buyer: { type: string }
                      provider: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /engagements/{id}/proof:
    get:
      operationId: getAgreementProof
      tags: [integrity]
      summary: Full receipt set for an engagement (ADR-001)
      description: |
        Every event-log entry that concerns this engagement, each with Pacta's
        EIP-712 signature over its `entry_hash` and - once a covering anchor
        lands - the Merkle inclusion proof to the publicly anchored root.
        Store these receipts outside Pacta: they are what makes tampering
        provable without Pacta's cooperation. Engagements that predate Phase 0
        report `pre_phase0: true` and an empty receipt set (no backfilling, by
        decision).
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: The receipt bundle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  engagement_id: { type: integer }
                  agreement_hash: { type: [string, 'null'] }
                  pre_phase0: { type: boolean }
                  eip712_domain: { $ref: '#/components/schemas/Eip712Domain' }
                  platform_pubkey: { type: string }
                  receipts:
                    type: array
                    items: { $ref: '#/components/schemas/Receipt' }
        '404': { $ref: '#/components/responses/NotFound' }

  /verify:
    post:
      operationId: verifyReceipt
      tags: [integrity]
      summary: Server-side receipt verification (convenience only)
      description: |
        Runs the open verifier's offline checks on one receipt: entry-hash
        recomputation, platform signature, agreement hash + both party
        signatures (for `AgreementLocked`), Merkle path to the anchored root.
        The response says it plainly: do not take this endpoint's word for it -
        re-run the same checks with the open-source verifier
        (`packages/verifier`, `pacta-verify receipt.json`), offline, against
        any RPC node. Independent re-verification is the point.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt: { $ref: '#/components/schemas/Receipt' }
      responses:
        '200':
          description: Check-by-check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pass: { type: boolean }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [PASS, FAIL, SKIP] }
                        detail: { type: string }
                  independent_verification: { type: string }
        '400': { $ref: '#/components/responses/Validation' }

  /integrity:
    get:
      operationId: getIntegrity
      tags: [integrity]
      summary: Replay the whole hash chain and report anchoring status
      description: |
        Recomputes every `entry_hash` from genesis and compares with the stored
        chain, and reports the last anchor and the platform's signing identity.
        Public and read-only.
      responses:
        '200':
          description: Chain replay result, last anchor, platform identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: object
                    properties:
                      ok: { type: boolean }
                      checked: { type: integer }
                      broken_at: { type: [integer, 'null'] }
                      reason: { type: [string, 'null'] }
                  entries: { type: integer }
                  last_anchor:
                    type: [object, 'null']
                    properties:
                      root: { type: string }
                      from_seq: { type: integer }
                      to_seq: { type: integer }
                      chain_id: { type: integer }
                      tx_hash: { type: string }
                      heartbeat: { type: boolean }
                      at: { type: string }
                  platform:
                    type: object
                    properties:
                      pubkey: { type: string }
                      anchor_sender: { type: string }
                      eip712_domain: { $ref: '#/components/schemas/Eip712Domain' }

  /keys/platform:
    get:
      operationId: getPlatformKey
      tags: [integrity]
      summary: Pacta's published signing pubkey
      description: >-
        What receipt verifiers check `pacta_sig` against, plus the address that
        sends anchor transactions and the EIP-712 domain.
      responses:
        '200':
          description: Platform signing identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pubkey: { type: string }
                  address: { type: string }
                  eip712_domain: { $ref: '#/components/schemas/Eip712Domain' }

  /agents/{id}/signing-key:
    post:
      operationId: registerAgentSigningKey
      tags: [integrity]
      summary: Register (or rotate to) a self-custody signing key
      description: |
        Registers the agent's own uncompressed secp256k1 pubkey. From then on
        the platform cannot sign for this party: `/agree` requires its
        signature. Custodial keys (the disclosed launch default) are created
        automatically at first signature; this is the upgrade path, and the
        registration itself is a logged event.
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pubkey]
              properties:
                pubkey:
                  type: string
                  description: Uncompressed secp256k1 public key (0x04 + 128 hex chars).
      responses:
        '201':
          description: The registered key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: { type: integer }
                  pubkey: { type: string }
                  custody: { type: string, enum: [self] }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /smbs/{id}/signing-key:
    post:
      operationId: registerSmbSigningKey
      tags: [integrity]
      summary: Register (or rotate to) a self-custody signing key (SMB)
      description: Same contract as the agent variant, for the provider side.
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pubkey]
              properties:
                pubkey:
                  type: string
                  description: Uncompressed secp256k1 public key (0x04 + 128 hex chars).
      responses:
        '201':
          description: The registered key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  smb_id: { type: integer }
                  pubkey: { type: string }
                  custody: { type: string, enum: [self] }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    idParam:
      name: id
      in: path
      required: true
      schema: { type: integer }
    stepIdParam:
      name: stepId
      in: path
      required: true
      schema: { type: integer }
    idempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: >-
        Any unique string per logical attempt. The first 2xx response is stored
        and replayed verbatim on retries with the same key (marked with an
        `idempotency-replayed: true` response header), so a timed-out client can
        retry without moving money twice. Reusing a key on a different
        operation returns 422.

  responses:
    Validation:
      description: 'Validation error: missing or invalid fields, invalid JSON.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown entity, registry reference or route.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        Conflict with protocol rules: illegal state transition, locked contract,
        insufficient funds, unvetted SMB, exposure cap exceeded, unknown or
        wrong-kind registry record, duplicate rating or duplicate SMB name.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RegistryUnavailable:
      description: |
        The configured registry adapter could not answer (network failure,
        upstream error, malformed response). The proof is neither verified nor
        rejected; retry when the registry is reachable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message stating the rule that was violated.

    EngagementState:
      type: string
      enum: [draft, agreed, funded, in_progress, submitted, completed, disputed, resolved]

    RatingAggregate:
      type: object
      required: [good, bad, score]
      properties:
        good: { type: integer }
        bad: { type: integer }
        score:
          type: integer
          description: good - bad; the primary search-ranking key.

    AgentBalance:
      type: object
      required: [id, name, balance_cents]
      properties:
        id: { type: integer }
        name: { type: string }
        balance_cents: { type: integer }

    SmbPublic:
      type: object
      required: [id, name, category, location, description, capabilities, vetted, rating]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        location: { type: string }
        description: { type: string }
        capabilities: { type: string }
        vetted: { type: boolean }
        rating: { $ref: '#/components/schemas/RatingAggregate' }
        stake_cents:
          type: integer
          description: "[Pacta] Collateral currently at risk."
        exposure_cap_cents:
          type: integer
          description: "[Pacta] 5 x stake + 50% of completed GMV."
        active_exposure_cents:
          type: integer
          description: "[Pacta] Summed price of engagements in active states."

    OfferStep:
      type: object
      required: [id, position, title, description]
      properties:
        id: { type: integer }
        position: { type: integer }
        title: { type: string }
        description: { type: string }
        verification_kind:
          type: [string, 'null']
          description: "[Pacta] Non-null marks a registry-anchored step."

    Offer:
      type: object
      required: [id, title, description, price_cents, upfront_pct, active, steps, smb]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        price_cents: { type: integer }
        upfront_pct: { type: integer }
        active: { type: boolean }
        steps:
          type: array
          items: { $ref: '#/components/schemas/OfferStep' }
        smb: { $ref: '#/components/schemas/SmbPublic' }

    EngagementStep:
      type: object
      required: [id, position, title, description, status, proof_verified]
      properties:
        id: { type: integer }
        position: { type: integer }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [pending, done]
        proof_text: { type: [string, 'null'] }
        proof_url: { type: [string, 'null'] }
        completed_at: { type: [string, 'null'] }
        verification_kind: { type: [string, 'null'] }
        proof_registry_ref: { type: [string, 'null'] }
        proof_verified:
          type: boolean
          description: "[Pacta] True when the proof matched a registry record of the required kind at completion time."

    Engagement:
      type: object
      required:
        [id, offer_id, title, state, price_cents, upfront_pct, upfront_cents,
         remaining_cents, agent, smb, escrow_balance_cents, steps, steps_done,
         steps_total, created_at, updated_at]
      properties:
        id: { type: integer }
        offer_id: { type: integer }
        title: { type: string }
        state: { $ref: '#/components/schemas/EngagementState' }
        price_cents: { type: integer }
        upfront_pct: { type: integer }
        upfront_cents:
          type: integer
          description: round(price_cents x upfront_pct / 100), escrowed at funding.
        remaining_cents:
          type: integer
          description: price_cents - upfront_cents, drawn at approval.
        dispute_reason: { type: [string, 'null'] }
        resolution:
          type: [string, 'null']
          enum: [release, refund, split, null]
        rating:
          type: [string, 'null']
          enum: [good, bad, null]
        agent:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        smb:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        escrow_balance_cents: { type: integer }
        agreement_hash:
          type: [string, 'null']
          description: >-
            SHA-256 of the canonical (RFC 8785) agreement terms - the
            engagement's universal identity once agreed (ADR-001). Null for
            drafts and pre-phase0 engagements.
        signatures:
          type: [object, 'null']
          description: EIP-712 signatures over agreement_hash (r||s||v hex).
          properties:
            buyer: { type: string }
            provider: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/EngagementStep' }
        steps_done: { type: integer }
        steps_total: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    Eip712Domain:
      type: object
      description: 'The EIP-712 signing domain: { name: "Pacta", version: "1", chainId }.'
      properties:
        name: { type: string }
        version: { type: string }
        chain_id: { type: integer }

    Receipt:
      type: object
      description: |
        The portable proof object a party stores outside Pacta (ADR-001).
        `entry` is one hash-chained event-log record; `pacta_sig` is Pacta's
        EIP-712 signature over `entry_hash`; `merkle_proof` and `anchor` are
        null until a covering anchor lands on the public chain, then backfilled
        on read. Verifiable offline with the open-source verifier
        (packages/verifier).
      required: [entry, merkle_proof, anchor, pacta_sig]
      properties:
        entry:
          type: object
          required: [seq, engagement, type, payload, at, prev_hash, entry_hash]
          properties:
            seq: { type: integer }
            engagement:
              type: string
              description: The agreement_hash, 'platform', or 'pre-phase0:<id>'.
            type:
              type: string
              description: >-
                KeyRegistered | AgreementLocked | EscrowFunded |
                EvidenceSubmitted | WorkSubmitted | SettlementApproved |
                DisputeOpened | RulingIssued | StakeChanged | RatingSubmitted.
            payload:
              type: object
              description: Hashes and metadata only - evidence bytes and free text never enter the log.
            at: { type: string }
            prev_hash: { type: string }
            entry_hash:
              type: string
              description: SHA-256(prev_hash || canonical entry) - the chain link.
        merkle_proof:
          type: [array, 'null']
          items:
            type: object
            properties:
              hash: { type: string }
              pos: { type: string, enum: [left, right] }
        anchor:
          type: [object, 'null']
          properties:
            root: { type: string }
            from_seq: { type: integer }
            to_seq: { type: integer }
            chain_id:
              type: integer
              description: 0 marks a simulated local-development anchor.
            tx_hash: { type: string }
            block_number: { type: [integer, 'null'] }
            block_time: { type: [string, 'null'] }
        pacta_sig: { type: [string, 'null'] }

    RegistryRecord:
      type: object
      required: [ref, kind, title, issued_to, details, created_at, source]
      properties:
        ref: { type: string }
        kind:
          type: string
          description: >-
            Open vocabulary; the seed data uses incorporation, land_eligibility,
            permit, tax_filing. The hacienda-cr adapter answers tax_registration.
        title: { type: string }
        issued_to: { type: string }
        details: { type: string }
        created_at:
          type: [string, 'null']
          description: Null when the upstream registry does not date its records.
        source:
          type: string
          enum: [local, http, hacienda-cr]
          description: The registry adapter that answered.

    Account:
      type: object
      required: [id, kind, ref_id, owner, balance_cents]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [agent, smb, escrow, stake]
        ref_id:
          type: integer
          description: Owner id (agent/smb/stake) or engagement id (escrow).
        owner: { type: [string, 'null'] }
        balance_cents: { type: integer, minimum: 0 }

    Transaction:
      type: object
      required: [id, engagement_id, from_account_id, to_account_id, amount_cents, type, memo, created_at]
      properties:
        id: { type: integer }
        engagement_id: { type: [integer, 'null'] }
        from_account_id:
          type: [integer, 'null']
          description: NULL denotes a mint (external deposit entering the system).
        to_account_id: { type: integer }
        amount_cents: { type: integer, minimum: 1 }
        type:
          type: string
          enum: [seed, escrow_fund, escrow_release, refund, split_release, split_refund, stake_slash]
        memo: { type: string }
        created_at: { type: string }

    Invariant:
      type: object
      required: [ok, total_balances_cents, total_minted_cents, mismatches]
      properties:
        ok:
          type: boolean
          description: True iff sum(balances) = sum(minted) and every balance replays from the journal.
        total_balances_cents: { type: integer }
        total_minted_cents: { type: integer }
        mismatches:
          type: array
          items:
            type: object
            required: [account_id, expected, actual]
            properties:
              account_id: { type: integer }
              expected: { type: integer }
              actual: { type: integer }
